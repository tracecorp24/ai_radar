version: '3.8'

services:
  # 1. PostgreSQL Veritabanı Servisi
  db:
    image: postgres:16-alpine
    container_name: ai_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI Backend REST API Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_backend_api
    restart: always
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_db}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js Frontend Dashboard Servisi
  frontend:
    build:
      context: ./ai_radar
      dockerfile: Dockerfile
    container_name: ai_frontend_ui
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 4. Nginx Reverse Proxy (Tüm sistemi Port 80 altında birleştirir)
  nginx:
    image: nginx:alpine
    container_name: ai_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
